# Firebase App Hosting configuration.
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # A photography site is bursty, not busy. These keep the bill near zero
  # while still handling a rush of visitors.
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

  # Image optimisation and the Lightroom proxy do real work on first hit.
  timeoutSeconds: 60
# ── Instagram ────────────────────────────────────────────────
# Uncomment once the secret exists, otherwise the deploy fails looking
# for it. Create it first with:
#
#   firebase apphosting:secrets:set INSTAGRAM_ACCESS_TOKEN
#
# It prompts for the value, stores it in Cloud Secret Manager, and never
# puts it in this repo. BUILD matters as well as RUNTIME, because the page
# is prerendered at build time.
#
# env:
#   - variable: INSTAGRAM_ACCESS_TOKEN
#     secret: INSTAGRAM_ACCESS_TOKEN
#     availability:
#       - BUILD
#       - RUNTIME

# ── Dashboard ────────────────────────────────────────────────
# The /dashboard password. Set or change it with:
#   firebase apphosting:secrets:set DASHBOARD_PASSWORD
# Dropbox access for the dashboard comes from scripts/connect-dashboard.mjs,
# which stores these three. Run it again to reconnect Dropbox.
env:
  - variable: DASHBOARD_PASSWORD
    secret: DASHBOARD_PASSWORD
    availability:
      - RUNTIME
  - variable: DROPBOX_APP_KEY
    secret: DROPBOX_APP_KEY
    availability:
      - RUNTIME
  - variable: DROPBOX_APP_SECRET
    secret: DROPBOX_APP_SECRET
    availability:
      - RUNTIME
  - variable: DROPBOX_REFRESH_TOKEN
    secret: DROPBOX_REFRESH_TOKEN
    availability:
      - RUNTIME
